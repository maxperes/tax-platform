services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tax
      POSTGRES_PASSWORD: tax
      POSTGRES_DB: tax_platform
    ports:
      - "5432:5432"
    volumes:
      - tax_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - tax_redis_data:/data

volumes:
  tax_pg_data:
  tax_redis_data:
